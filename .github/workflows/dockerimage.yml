# .github/workflows/dockerimage.yml
name: Docker Image CI & Publish

on: [ push ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # Every branch builds; only main/master logs in to and pushes to Docker Hub
      PUBLISH: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}
    strategy:
      matrix:
        dcmtk_version: ['3.6.7', '3.6.8', '3.6.9', '3.7.0']
        # Keep one entry per Node major: each also publishes a floating dcmtk-X-nodejs-<major> tag
        node_version: [
          '26.12.1-alpine3.24',
          '24.22.1-alpine3.24',
          '22.23.4-alpine3.24',
#          '20.19.6-alpine3.23', #'20.18.3-alpine3.21',
        ]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Compute Node major version
        id: node
        env:
          NODE_VER: ${{ matrix.node_version }}
        run: echo "major=${NODE_VER%%.*}" >> "$GITHUB_OUTPUT"

      - name: Build Docker Image (push on main/master only)
        uses: docker/build-push-action@v4
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            michaelleehobbs/nodejs-dcmtk:dcmtk-${{ matrix.dcmtk_version }}-nodejs-${{ matrix.node_version }}
            michaelleehobbs/nodejs-dcmtk:dcmtk-${{ matrix.dcmtk_version }}-nodejs-${{ steps.node.outputs.major }}
          build-args: |
            DCMTK_VER=${{ matrix.dcmtk_version }}
            NODE_VER=${{ matrix.node_version }}
#          platforms: linux/amd64,linux/arm64 # do not support arm because it is god awfully slow on github actions
          platforms: linux/amd64
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_INLINE_CACHE: 1
          BUILDKIT_FRONTEND_ATTRS: >
            {"moby.buildkit.frontend.inline-squash": "true"}
