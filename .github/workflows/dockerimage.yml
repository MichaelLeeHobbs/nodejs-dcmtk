# .github/workflows/dockerimage.yml
name: Docker Image CI & Publish

on: [ push ]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        dcmtk_version: ['3.6.7', '3.6.8', '3.6.9', '3.7.0']
        node_version: [
          '24.12.0-alpine3.23', #'22.14.0-alpine3.21',
          '22.21.1-alpine3.23', #'22.11.0-alpine3.20'
          '20.19.6-alpine3.23', #'20.18.3-alpine3.21',
        ]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: michaelleehobbs/nodejs-dcmtk:dcmtk-${{ matrix.dcmtk_version }}-nodejs-${{ matrix.node_version }}
          build-args: |
            DCMTK_VER=${{ matrix.dcmtk_version }}
            NODE_VER=${{ matrix.node_version }}
#          platforms: linux/amd64,linux/arm64 # do not support arm because it is god awfully slow on github actions
          platforms: linux/amd64
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_INLINE_CACHE: 1
          BUILDKIT_FRONTEND_ATTRS: >
            {"moby.buildkit.frontend.inline-squash": "true"}
